<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#0f172a">A group is one entry in the list that plays several designs and loops. The button steps past the whole group.</text>

  <!-- the design list -->
  <text x="20" y="58" font-size="10.5" font-weight="700" fill="#94a3b8">DESIGNS &#183; switch &#8220;Christmas&#8221;</text>

  <!-- 1. single design -->
  <rect x="20" y="70" width="470" height="40" rx="9" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="36" y="95" font-size="11" font-weight="700" fill="#94a3b8">1</text>
  <rect x="52" y="81" width="18" height="18" rx="5" fill="#ef4444"/>
  <text x="82" y="95" font-size="12" font-weight="600" fill="#0f172a">Red wash</text>
  <rect x="420" y="81" width="50" height="18" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="432" y="94" font-size="9.5" font-weight="700" fill="#3b6ef0">seq</text>

  <!-- 2. the group -->
  <rect x="20" y="120" width="470" height="110" rx="9" fill="#eef2ff" stroke="#3b6ef0" stroke-width="2"/>
  <text x="36" y="145" font-size="11" font-weight="700" fill="#3b6ef0">2</text>
  <text x="82" y="145" font-size="12" font-weight="700" fill="#0f172a">Winter mix</text>
  <rect x="402" y="131" width="68" height="18" rx="9" fill="#3b6ef0"/>
  <text x="411" y="144" font-size="9.5" font-weight="700" fill="#ffffff">group &#183; 3</text>

  <!-- members -->
  <rect x="44" y="162" width="118" height="30" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="181" font-size="10.5" fill="#0f172a">Snowfall</text>
  <text x="170" y="181" font-size="12" fill="#3b6ef0">&#8594;</text>
  <rect x="188" y="162" width="118" height="30" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="200" y="181" font-size="10.5" fill="#0f172a">Candy Cane</text>
  <text x="314" y="181" font-size="12" fill="#3b6ef0">&#8594;</text>
  <rect x="332" y="162" width="118" height="30" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="344" y="181" font-size="10.5" fill="#0f172a">Icicles</text>

  <!-- loop arrow under the members -->
  <path d="M441 196 L441 210 L53 210 L53 198" fill="none" stroke="#3b6ef0" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M53 192 l-4.5 7 h9 z" fill="#3b6ef0"/>
  <text x="196" y="224" font-size="10" font-weight="600" fill="#3b6ef0">plays them in order, then starts again</text>

  <!-- 3. single design -->
  <rect x="20" y="240" width="470" height="40" rx="9" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="36" y="265" font-size="11" font-weight="700" fill="#94a3b8">3</text>
  <rect x="52" y="251" width="18" height="18" rx="5" fill="#22c55e"/>
  <text x="82" y="265" font-size="12" font-weight="600" fill="#0f172a">Green wash</text>
  <rect x="420" y="251" width="50" height="18" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="432" y="264" font-size="9.5" font-weight="700" fill="#3b6ef0">seq</text>

  <!-- the button, stepping past the group -->
  <rect x="540" y="70" width="300" height="210" rx="10" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="560" y="96" font-size="11" font-weight="700" fill="#0f172a">The pushbutton</text>

  <circle cx="572" cy="128" r="9" fill="#3b6ef0"/>
  <text x="590" y="132" font-size="11" fill="#475569">press &#8594; entry 1</text>
  <circle cx="572" cy="162" r="9" fill="#3b6ef0"/>
  <text x="590" y="166" font-size="11" fill="#475569">press &#8594; entry 2, the whole group</text>
  <circle cx="572" cy="196" r="9" fill="#3b6ef0"/>
  <text x="590" y="200" font-size="11" fill="#475569">press &#8594; entry 3</text>

  <text x="560" y="236" font-size="10.5" fill="#94a3b8">It never steps through a group's members &#8212;</text>
  <text x="560" y="252" font-size="10.5" fill="#94a3b8">the group loops on its own until you move on.</text>

  <text x="20" y="306" font-size="10.5" fill="#64748b">Stored as a real FPP playlist, so FPP's own player walks it. Your own playlists are never touched.</text>
</svg>
